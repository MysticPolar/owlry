name: Deploy owl-chat edge function

# One-click deploy of the live owl's brain to your Supabase project.
# Manual trigger only (Actions tab → "Run workflow") so it never runs before
# you've added the credentials below.
#
# Requires, in repo Settings → Secrets and variables → Actions:
#   • Secret   SUPABASE_ACCESS_TOKEN   (Supabase dashboard → Account → Access Tokens)
#   • Variable SUPABASE_PROJECT_REF    (the <ref> in https://<ref>.supabase.co)
#
# The ANTHROPIC_API_KEY is NOT set here — set it once in the Supabase dashboard
# (Edge Functions → Secrets), so the key lives only in Supabase, never in GitHub.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy owl-chat
        run: supabase functions deploy owl-chat --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
