name: Deploy edge functions (owl-chat + owl-peek + signup-with-invite)

# One-click deploy of the live owl functions to your Supabase project.
# Manual trigger only (Actions tab → "Run workflow") so it never runs before
# you've added the credentials below — and never on a push.
#
# Requires, in repo Settings → Secrets and variables → Actions:
#   • Secret   SUPABASE_ACCESS_TOKEN   (Supabase dashboard → Account → Access Tokens)
#   • Variable SUPABASE_PROJECT_REF    (the <ref> in https://<ref>.supabase.co)
#
# ANTHROPIC_API_KEY is NOT set here — set it once in the Supabase dashboard
# (Edge Functions → Secrets), so the key lives only in Supabase, never in
# GitHub. Supabase injects SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY /
# SUPABASE_ANON_KEY into every function automatically.
#
# owl-chat + owl-peek are JWT-gated (default); signup-with-invite is public
# (--no-verify-jwt) because the landing page calls it before a session exists.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy owl-chat
        run: supabase functions deploy owl-chat --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      - name: Deploy owl-peek
        run: supabase functions deploy owl-peek --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      - name: Deploy signup-with-invite (public — no JWT)
        run: supabase functions deploy signup-with-invite --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
