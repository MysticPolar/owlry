name: Deploy preview to GitHub Pages

# Builds the app and publishes it to GitHub Pages on every push, so the
# latest version is always live at a stable URL — no local server needed.

on:
  push:
    branches: [renovation/homescreen]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; newer pushes supersede in-flight ones
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Verify configured backend contract
        env:
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ANON_KEY" || -z "$SUPABASE_PROJECT_REF" ]]; then
            echo "No Supabase backend configured; building the offline app."
            exit 0
          fi
          check_backend() {
            curl \
              --silent \
              --show-error \
              --fail \
              --request GET \
              --url "https://$SUPABASE_PROJECT_REF.supabase.co/rest/v1/owlry_progress?select=revision&limit=0" \
              --header "apikey: $SUPABASE_ANON_KEY" \
              --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
              >/dev/null \
            && curl \
              --silent \
              --show-error \
              --fail \
              --request POST \
              --url "https://$SUPABASE_PROJECT_REF.supabase.co/storage/v1/object/list/owlry-uploads" \
              --header "apikey: $SUPABASE_ANON_KEY" \
              --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
              --header "Content-Type: application/json" \
              --data '{"prefix":"","limit":1,"offset":0}' \
              >/dev/null
          }
          for attempt in $(seq 1 48); do
            if check_backend; then
              echo "Supabase progress and upload contracts are ready."
              exit 0
            fi
            echo "Waiting for the backend migration ($attempt/48)…"
            sleep 5
          done
          echo "The configured backend did not become ready in four minutes." >&2
          check_backend
      - run: npm ci
      - run: npm run build
        env:
          # relative base works for both github.io/owlry/ and app.owlry.ai/
          BASE_PATH: ./
          # backend wiring — set these as repo Variables to light up the live owl
          # (both are public-safe: the anon key is protected by RLS). Empty = the
          # app runs local-only with the offline mockup brain, exactly as before.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
