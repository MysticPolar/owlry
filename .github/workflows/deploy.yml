name: Deploy app.owlry.ai to GitHub Pages

# Builds both apps from main and publishes them as one site on every push:
#
#   https://app.owlry.ai/           Owlry (the root app, a PWA)
#   https://app.owlry.ai/council/   the Council Room (src/council), reachable
#                                   only by URL and behind an access code
#
# One artifact holds both, so a deploy can never drop /council/ again (the
# old split — a root deploy here, a Council preview from its own branch —
# made whichever ran last own the site).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; newer pushes supersede in-flight ones
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Verify configured backend contract
        env:
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ANON_KEY" || -z "$SUPABASE_PROJECT_REF" ]]; then
            echo "No Supabase backend configured; building the offline app."
            exit 0
          fi
          check_backend() {
            curl \
              --silent \
              --show-error \
              --fail \
              --request GET \
              --url "https://$SUPABASE_PROJECT_REF.supabase.co/rest/v1/owlry_progress?select=revision&limit=0" \
              --header "apikey: $SUPABASE_ANON_KEY" \
              --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
              >/dev/null \
            && curl \
              --silent \
              --show-error \
              --fail \
              --request POST \
              --url "https://$SUPABASE_PROJECT_REF.supabase.co/storage/v1/object/list/owlry-uploads" \
              --header "apikey: $SUPABASE_ANON_KEY" \
              --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
              --header "Content-Type: application/json" \
              --data '{"prefix":"","limit":1,"offset":0}' \
              >/dev/null
          }
          for attempt in $(seq 1 48); do
            if check_backend; then
              echo "Supabase progress and upload contracts are ready."
              exit 0
            fi
            echo "Waiting for the backend migration ($attempt/48)…"
            sleep 5
          done
          echo "The configured backend did not become ready in four minutes." >&2
          check_backend
      - name: Nothing in Owlry points at the Council
        # the Council is reachable only by someone who has the URL
        run: |
          if git grep -n -i -e '/council' -- src ':!src/council' index.html public; then
            echo "::error::Owlry references /council (above); the Council must stay unlinked" >&2
            exit 1
          fi
      - run: npm ci
      - name: Build Owlry (/) and the Council Room (/council/) into one dist/
        env:
          # relative base works for both github.io/owlry/ and app.owlry.ai/
          BASE_PATH: ./
          # backend wiring — set these as repo Variables to light up the live owl
          # (both are public-safe: the anon key is protected by RLS). Empty = the
          # app runs local-only with the offline mockup brain, exactly as before.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # the Council's access code, as its SHA-256 (src/council/gate/access.ts)
          VITE_COUNCIL_ACCESS_HASH: ${{ vars.VITE_COUNCIL_ACCESS_HASH }}
        run: |
          set -euo pipefail
          if [[ ! "$VITE_COUNCIL_ACCESS_HASH" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::repository variable VITE_COUNCIL_ACCESS_HASH is missing or not a SHA-256; /council/ would stay locked for everyone" >&2
            exit 1
          fi
          npm run build    # tsc -b && vite build && vite build --config vite.council.config.ts
          # the root worker answers every navigation on the origin: it must leave /council/ alone
          grep -q 'council' dist/sw.js || { echo "::error::dist/sw.js lacks the /council/ navigation denylist" >&2; exit 1; }
          ! grep -q 'council/index.html' dist/sw.js || { echo "::error::dist/sw.js precaches the Council" >&2; exit 1; }
          test -f dist/index.html && test -f dist/council/index.html && test -f dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
