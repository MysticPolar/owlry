name: Deploy preview to GitHub Pages

# Builds the app and publishes it to GitHub Pages on every push, so the
# latest version is always live at a stable URL — no local server needed.

on:
  push:
    branches: [claude/practical-mayer-dflxq5, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; newer pushes supersede in-flight ones
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          # relative base works for both github.io/owlry/ and app.owlry.ai/
          BASE_PATH: ./
          # backend wiring — set these as repo Variables to light up the live owl
          # (both are public-safe: the anon key is protected by RLS). Empty = the
          # app runs local-only with the offline mockup brain, exactly as before.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
