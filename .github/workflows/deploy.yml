name: Deploy preview to GitHub Pages

# Builds the app and publishes it to GitHub Pages on every push, so the
# latest version is always live at a stable URL — no local server needed.

on:
  push:
    branches: [claude/cool-bell-kvw63j, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; newer pushes supersede in-flight ones
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          # project pages are served from /<repo>/
          BASE_PATH: /owlry/
          # Supabase backend. The anon/publishable key is a PUBLIC key (it ships in
          # the browser bundle regardless; RLS protects the data). Override via repo
          # Variables (Settings → Secrets and variables → Actions → Variables) to rotate.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://twxzbpfchoctxyjeivvr.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_FwA85u6vpFXzBf4fHhBm8A_F7A-ocHb' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
